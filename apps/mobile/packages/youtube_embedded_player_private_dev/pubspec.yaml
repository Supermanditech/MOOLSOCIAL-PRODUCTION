    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.moolsocial.youtube_embedded_player_private_dev
        pluginClass: YouTubeEmbeddedPlayerPrivateDevPlugin
      ios:
        pluginClass: YouTubeEmbeddedPlayerPrivateDevPlugin
