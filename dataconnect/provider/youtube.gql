mutation DeleteYouTubeOAuthAttempts($userId: String!)
@auth(level: NO_ACCESS) {
  _execute(
    sql: """
      DELETE FROM external_oauth_attempt
      WHERE user_id = $1 AND provider = 'YOUTUBE'
