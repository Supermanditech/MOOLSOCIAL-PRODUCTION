query ActiveYouTubeConnection($userId: String!) @auth(level: NO_ACCESS) {
  externalProviderConnections(
    where: {
      userId: {eq: $userId}
      provider: {eq: YOUTUBE}
      status: {eq: ACTIVE}
    }
    limit: 1
  ) {
    connectionKey
    userId
    channelId
    channelTitle
    grantedScopesJson
    connectedAt
    lastVerifiedAt
    status
  }
}

mutation SaveYouTubeConnection(
  $connectionKey: String!
  $userId: String!
  $channelId: String!
  $channelTitle: String!
  $scopesJson: String!
  $status: ExternalProviderConnectionStatus!
  $connectedAt: Timestamp!
  $lastVerifiedAt: Timestamp!
) @auth(level: NO_ACCESS) {
  externalProviderConnection_upsert(
    data: {
      connectionKey: $connectionKey
      userId: $userId
      provider: YOUTUBE
      channelId: $channelId
      channelTitle: $channelTitle
      grantedScopesJson: $scopesJson
      status: $status
      connectedAt: $connectedAt
      lastVerifiedAt: $lastVerifiedAt
    }
  )
}

mutation RevokeYouTubeConnection(
  $connectionKey: String!
  $revokedAt: Timestamp!
  $deletionDueAt: Timestamp!
) @auth(level: NO_ACCESS) {
  externalProviderConnection_update(
    key: {connectionKey: $connectionKey}
    data: {
      status: REVOKED
      revokedAt: $revokedAt
      deletionDueAt: $deletionDueAt
    }
  )
}

mutation DeleteYouTubeConnection($connectionKey: String!)
@auth(level: NO_ACCESS) {
  externalProviderConnection_delete(key: {connectionKey: $connectionKey})
}

query YouTubeCredential($connectionKey: String!)
@auth(level: NO_ACCESS) {
  externalProviderCredential(key: {connectionKey: $connectionKey}) {
    connectionKey
    encryptedRefreshToken
    grantedScopesJson
    createdAt
    updatedAt
  }
}

mutation SaveYouTubeCredential(
  $connectionKey: String!
  $encryptedRefreshToken: String!
  $scopesJson: String!
  $createdAt: Timestamp!
  $updatedAt: Timestamp!
) @auth(level: NO_ACCESS) {
  externalProviderCredential_upsert(
    data: {
      connectionKey: $connectionKey
      encryptedRefreshToken: $encryptedRefreshToken
      grantedScopesJson: $scopesJson
      createdAt: $createdAt
      updatedAt: $updatedAt
    }
  )
}

mutation MigrateYouTubeCredentialEncryption(
  $connectionKey: String!
  $expectedEncryptedRefreshToken: String!
  $encryptedRefreshToken: String!
  $scopesJson: String!
  $updatedAt: Timestamp!
) @auth(level: NO_ACCESS) {
  migrated: _executeReturningFirst(
    sql: """
      UPDATE external_provider_credential
      SET
        encrypted_refresh_token = $3,
        granted_scopes_json = $4,
        updated_at = $5
      WHERE
        connection_key = $1
        AND encrypted_refresh_token = $2
      RETURNING connection_key
    """
    params: [
      $connectionKey
      $expectedEncryptedRefreshToken
      $encryptedRefreshToken
      $scopesJson
      $updatedAt
    ]
  )
}

mutation DeleteYouTubeCredential($connectionKey: String!)
@auth(level: NO_ACCESS) {
  externalProviderCredential_delete(key: {connectionKey: $connectionKey})
}

mutation SaveYouTubeOAuthAttempt(
  $stateHash: String!
  $userId: String!
  $encryptedCodeVerifier: String!
  $scopesJson: String!
  $redirectUri: String!
  $createdAt: Timestamp!
  $expiresAt: Timestamp!
) @auth(level: NO_ACCESS) {
  externalOAuthAttempt_upsert(
    data: {
      stateHash: $stateHash
      userId: $userId
      provider: YOUTUBE
      encryptedCodeVerifier: $encryptedCodeVerifier
      requestedScopesJson: $scopesJson
      redirectUri: $redirectUri
      createdAt: $createdAt
      expiresAt: $expiresAt
      consumedAt: null
    }
  )
}

mutation ConsumeYouTubeOAuthAttempt(
  $stateHash: String!
  $userId: String!
) @auth(level: NO_ACCESS) {
  attempt: _executeReturningFirst(
    sql: """
      UPDATE external_oauth_attempt
      SET consumed_at = NOW()
      WHERE
        state_hash = $1
        AND user_id = $2
        AND consumed_at IS NULL
        AND expires_at > NOW()
      RETURNING
        state_hash,
        user_id,
        encrypted_code_verifier,
        requested_scopes_json,
        redirect_uri,
        created_at,
        expires_at
    """
    params: [$stateHash, $userId]
  )
}

