enum AccountStatus {
  ACTIVE
  RESTRICTED
  DELETED
}

enum AreaMode {
  CURRENT
  MANUAL
  SKIPPED
}

enum RouteStatus {
  PENDING
  CONSUMED
  EXPIRED
}

type AppUser @table(key: "uid") {
  uid: String! @default(expr: "auth.uid")
  displayName: String @col(dataType: "varchar(120)")
  # B01 global account Profile only. No order, payment or Workspace authority.
  # Local source contract; provisioning/migration remain separately held.
  profileRevision: Int! @default(value: 0)
  profileDataJson: String
  profileReceiptsJson: String
  status: AccountStatus!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# B02 source contract only. Provisioning and billing/admin writers are deferred.
# No client mutation is exposed. A catalogue may have any supported plan count;
# its versioned document is validated by the privileged read service.
type AccountPlanCatalogue @table(name: "account_plan_catalogue", key: "audience") {
  audience: String! @col(dataType: "varchar(16)")
  documentJson: String!
  updatedAt: Timestamp! @default(expr: "request.time")
}

# One account-and-audience/Store-bound assigned subscription document. Future
# verified billing writers must preserve assigned-version benefits and dates.
type AccountPlanSubscription @table(name: "account_plan_subscription", key: "scopeKey") {
  scopeKey: String! @col(dataType: "varchar(64)")
  owner: AppUser!
  documentJson: String!
  updatedAt: Timestamp! @default(expr: "request.time")
}

type UserPreference @table {
  user: AppUser!
  languageCode: String! @col(dataType: "varchar(12)")
  areaMode: AreaMode!
  areaLabel: String @col(dataType: "varchar(160)")
  areaPlaceId: String @col(dataType: "varchar(180)")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ConsentReceipt @table {
  user: AppUser!
  purpose: String! @col(dataType: "varchar(80)")
  noticeVersion: String! @col(dataType: "varchar(40)")
  languageCode: String! @col(dataType: "varchar(12)")
  granted: Boolean!
  recordedAt: Timestamp! @default(expr: "request.time")
}

type DeviceInstallation @table {
  user: AppUser
  installationId: String! @col(dataType: "varchar(180)")
  platform: String! @col(dataType: "varchar(20)")
  appVersion: String! @col(dataType: "varchar(40)")
  pushTokenHash: String @col(dataType: "varchar(128)")
  lastSeenAt: Timestamp! @default(expr: "request.time")
}

type PendingRoute @table {
  user: AppUser!
  route: String! @col(dataType: "varchar(320)")
  status: RouteStatus!
  expiresAt: Timestamp!
  createdAt: Timestamp! @default(expr: "request.time")
  consumedAt: Timestamp
}
