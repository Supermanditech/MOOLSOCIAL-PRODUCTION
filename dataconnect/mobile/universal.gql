query GetMyAccount @auth(level: USER) {
  appUser(key: {uid_expr: "auth.uid"}) {
    uid
    displayName
    status
    createdAt
    updatedAt
  }
}

# B02 privileged read only. Account/Store ownership is checked in the HTTP
# service before this projection; direct client use is intentionally forbidden.
query ReadScopedAccountPlansSnapshot($uid: String!, $audience: String!, $scopeKey: String!)
  @auth(level: NO_ACCESS) {
  rows: _executeQuery(
    sql: """
      SELECT a.uid AS "ownerUid", a.status AS "accountStatus",
             c.document_json AS catalogue, s.document_json AS subscription
      FROM app_user a
      LEFT JOIN account_plan_catalogue c ON c.audience = $2
      LEFT JOIN account_plan_subscription s ON s.scope_key = $3 AND s.owner_uid = a.uid
      WHERE a.uid = $1
    """
    params: [$uid, $audience, $scopeKey]
  )
}

mutation UpsertMyAccount($displayName: String)
  @auth(level: USER)
  @transaction {
  # Keep the existing SDK result key while making bootstrap create-only.
  # Repeated sign-in must never overwrite name, status or Profile revision.
  # Deploy only with the coordinated read-before-create client qualification.
  appUser_upsert: appUser_insert(
    data: {
      uid_expr: "auth.uid"
      displayName: $displayName
      status: ACTIVE
      updatedAt_expr: "request.time"
    }
  )
}
