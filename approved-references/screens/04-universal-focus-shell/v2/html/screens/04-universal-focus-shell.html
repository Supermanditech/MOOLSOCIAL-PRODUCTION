<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000080">
  <title>MoolSocial</title>
  <link rel="stylesheet" href="../shared/moolsocial-ui-foundation.css">
  <style>
    :root {
      color-scheme: light;
      --navy: #000080;
      --saffron: #FF9933;
      --green: #138808;
      --white: #FFFFFF;
      --ink: #11112B;
      --muted: #5F6273;
      --line: rgba(0, 0, 128, .12);
      --surface: #FFFFFF;
      --soft: #F5F6FB;
      --soft-navy: #EEEEFA;
      --danger: #B3261E;
      --shadow: 0 18px 48px rgba(0, 0, 44, .16);
      --ease: cubic-bezier(.2, .8, .2, 1);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ECEEF6;
      color: var(--ink);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    svg {
      display: block;
    }

    .symbol-bank {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .universal-app {
      position: relative;
      display: flex;
      width: min(100%, 430px);
      height: 100dvh;
      min-height: 100%;
      margin: 0 auto;
      overflow: hidden;
      background: var(--soft);
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .app-column {
      display: flex;
      flex: 1;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
    }

    .app-header {
      position: relative;
      z-index: 5;
      flex: 0 0 auto;
      padding: max(.55rem, env(safe-area-inset-top)) .75rem .7rem;
      color: var(--white);
      background:
        radial-gradient(circle at 85% 0%, rgba(255, 153, 51, .2), transparent 34%),
        linear-gradient(150deg, #000080 0%, #00006A 100%);
      box-shadow: 0 8px 24px rgba(0, 0, 80, .17);
    }

    .universal-app.social-shorts-immersive .app-header {
      padding-top: max(.32rem, env(safe-area-inset-top));
      padding-bottom: .28rem;
      box-shadow: 0 6px 18px rgba(0, 0, 80, .14);
    }

    .universal-app.social-shorts-immersive .app-header .area-row,
    .universal-app.social-shorts-immersive .app-header .command-bar {
      display: none;
    }

    @media (max-height: 650px) {
      .universal-app.social-shorts-immersive .app-header {
        display: none;
      }
    }

    .brand-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: .35rem;
    }

    .brand-home {
      display: flex;
      min-width: 0;
      min-height: 44px;
      align-items: center;
      justify-content: flex-start;
      gap: .5rem;
      padding: .15rem 0;
      color: var(--white);
      cursor: pointer;
      background: transparent;
      text-align: left;
    }

    .brand-lockup {
      display: grid;
      min-width: 0;
      gap: .22rem;
    }

    .wordmark {
      overflow: hidden;
      font-size: 1.28rem;
      font-weight: 820;
      letter-spacing: -.045em;
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .identity-line {
      display: grid;
      width: min(9.4rem, 80%);
      height: 3px;
      overflow: hidden;
      grid-template-columns: 45fr 14fr 41fr;
      border-radius: 999px;
    }

    .identity-line span:nth-child(1) {
      background: var(--saffron);
    }

    .identity-line span:nth-child(2) {
      background: var(--white);
    }

    .identity-line span:nth-child(3) {
      background: var(--green);
    }

    .header-icon {
      position: relative;
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 50%;
      color: var(--white);
      cursor: pointer;
      background: rgba(255, 255, 255, .11);
      transition: transform 160ms var(--ease), background 160ms var(--ease);
    }

    .header-icon:active,
    .brand-home:active,
    .area-entry:active {
      transform: scale(.96);
    }

    .header-icon svg,
    .command-icon svg,
    .area-entry svg,
    .dock-edge svg,
    .context-action svg,
    .sheet-close svg,
    .card-arrow svg {
      width: 1.22rem;
      height: 1.22rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .unread-dot {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 8px;
      height: 8px;
      border: 2px solid var(--navy);
      border-radius: 50%;
      background: var(--saffron);
    }

    .area-row {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      margin-top: .35rem;
    }

    .area-entry {
      display: inline-flex;
      min-width: 0;
      min-height: 44px;
      align-items: center;
      gap: .4rem;
      padding: .35rem .7rem;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      color: var(--white);
      cursor: pointer;
      background: rgba(255, 255, 255, .1);
    }

    .area-copy {
      display: grid;
      min-width: 0;
      gap: .04rem;
      text-align: left;
    }

    .area-copy small {
      color: rgba(255, 255, 255, .72);
      font-size: .64rem;
      font-weight: 650;
      letter-spacing: .02em;
      line-height: 1.05;
    }

    .area-copy strong {
      overflow: hidden;
      font-size: .78rem;
      font-weight: 750;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .command-bar {
      display: grid;
      min-width: 0;
      grid-template-columns: minmax(0, 1fr) 44px 44px;
      align-items: stretch;
      gap: .35rem;
      margin-top: .5rem;
    }

    .command-search {
      display: grid;
      min-width: 0;
      min-height: 44px;
      grid-template-columns: 1.15rem minmax(0, 1fr);
      align-items: center;
      gap: .45rem;
      padding: .5rem .7rem;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 14px;
      color: var(--navy);
      cursor: pointer;
      background: rgba(255, 255, 255, .96);
      text-align: left;
    }

    .command-search svg {
      width: 1.1rem;
      height: 1.1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .command-copy {
      overflow: hidden;
      color: #4D5066;
      font-size: .78rem;
      font-weight: 620;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .command-icon {
      display: grid;
      width: 44px;
      min-height: 44px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 14px;
      color: var(--white);
      cursor: pointer;
      background: rgba(255, 255, 255, .12);
    }

    .focus-shell {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      background:
        radial-gradient(circle at 0% 0%, rgba(255, 153, 51, .08), transparent 31%),
        var(--soft);
    }

    .focus-head {
      display: flex;
      flex: 0 0 auto;
      align-items: flex-end;
      justify-content: space-between;
      gap: .65rem;
      padding: .8rem .9rem .45rem;
    }

    .focus-title {
      min-width: 0;
    }

    .focus-title h1 {
      margin: 0;
      color: var(--navy);
      font-size: 1.5rem;
      font-weight: 820;
      letter-spacing: -.035em;
      line-height: 1.03;
    }

    .focus-title p {
      margin: .2rem 0 0;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .focus-badge {
      display: inline-flex;
      min-height: 28px;
      flex: 0 0 auto;
      align-items: center;
      padding: .2rem .55rem;
      border: 1px solid rgba(19, 136, 8, .18);
      border-radius: 999px;
      color: #0A6900;
      background: rgba(19, 136, 8, .08);
      font-size: .68rem;
      font-weight: 760;
      line-height: 1.1;
    }

    .sub-action-strip {
      display: flex;
      flex: 0 0 auto;
      gap: .45rem;
      margin: 0;
      padding: .35rem .9rem .7rem;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }

    .sub-action-strip::-webkit-scrollbar,
    .focused-actions::-webkit-scrollbar,
    .mool-actions::-webkit-scrollbar,
    .chip-row::-webkit-scrollbar {
      display: none;
    }

    .sub-action-strip[hidden] {
      display: none !important;
    }

    html[data-rail-direction="capability"] .sub-action-strip.main-action-strip {
      display: grid;
      min-height: 58px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      margin: 0 .9rem .7rem;
      padding: .22rem;
      overflow: visible;
      border: 1px solid rgba(0, 0, 128, .1);
      border-radius: 18px;
      background: rgba(255, 255, 255, .82);
      box-shadow:
        0 9px 24px rgba(0, 0, 70, .08),
        inset 0 1px 0 rgba(255, 255, 255, .96);
      backdrop-filter: blur(18px) saturate(150%);
    }

    .main-action-button {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 50px;
      grid-template-rows: 18px minmax(0, auto);
      place-items: center;
      align-content: center;
      gap: .18rem;
      padding: .24rem .18rem;
      border-radius: 14px;
      color: var(--navy);
      cursor: pointer;
      background: transparent;
      font-size: .61rem;
      font-weight: 760;
      line-height: 1.08;
      text-align: center;
      transition:
        color 160ms var(--ease),
        background-color 160ms var(--ease),
        transform 160ms var(--ease);
    }

    .main-action-button:not(:last-child)::after {
      position: absolute;
      top: 12px;
      right: 0;
      bottom: 12px;
      width: 1px;
      background: rgba(0, 0, 128, .09);
      content: "";
    }

    .main-action-button svg {
      width: 1rem;
      height: 1rem;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .main-action-button span {
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .main-action-button:hover,
    .main-action-button:focus-visible {
      color: var(--white);
      background: var(--navy);
    }

    .main-action-button:active {
      transform: scale(.96);
    }

    .sub-action-chip {
      display: inline-flex;
      min-width: max-content;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: .55rem .85rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--navy);
      cursor: pointer;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 6px 18px rgba(0, 0, 70, .05);
      font-size: .78rem;
      font-weight: 730;
      scroll-snap-align: start;
      transition: color 160ms var(--ease), background 160ms var(--ease), transform 160ms var(--ease);
    }

    .sub-action-chip.active {
      border-color: var(--navy);
      color: var(--white);
      background: var(--navy);
      box-shadow: 0 8px 20px rgba(0, 0, 128, .2);
    }

    .sub-action-chip:active {
      transform: scale(.97);
    }

    .focus-stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .content-scroll {
      width: 100%;
      height: 100%;
      padding: 0 4.7rem 1.1rem .9rem;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 128, .2) transparent;
    }

    .world-panel {
      display: grid;
      gap: .7rem;
      animation: content-in 280ms var(--ease) both;
    }

    @keyframes content-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-card {
      position: relative;
      display: grid;
      min-height: 11.5rem;
      align-content: end;
      gap: .45rem;
      overflow: hidden;
      padding: 1rem;
      border-radius: 8px;
      color: var(--white);
      background:
        linear-gradient(180deg, rgba(0, 0, 42, .04) 14%, rgba(0, 0, 42, .86) 100%),
        var(--hero-background, linear-gradient(135deg, #14149C, #000050));
      box-shadow: 0 14px 30px rgba(0, 0, 58, .16);
    }

    .hero-card::before {
      position: absolute;
      top: -2.1rem;
      right: -1.5rem;
      width: 8rem;
      height: 8rem;
      border: 1.2rem solid rgba(255, 255, 255, .08);
      border-radius: 50%;
      content: "";
    }

    .hero-card::after {
      position: absolute;
      top: .85rem;
      right: .9rem;
      width: 3.7rem;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--saffron) 0 45%, var(--white) 45% 59%, var(--green) 59%);
      content: "";
    }

    .hero-card > * {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      margin: 0;
      color: rgba(255, 255, 255, .76);
      font-size: .68rem;
      font-weight: 780;
      letter-spacing: .06em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .hero-card h2 {
      max-width: 14rem;
      margin: 0;
      font-size: 1.35rem;
      font-weight: 820;
      letter-spacing: -.035em;
      line-height: 1.08;
    }

    .hero-card p {
      max-width: 17rem;
      margin: 0;
      color: rgba(255, 255, 255, .82);
      font-size: .78rem;
      font-weight: 560;
      line-height: 1.38;
    }

    .hero-primary {
      display: inline-flex;
      width: fit-content;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      margin-top: .15rem;
      padding: .55rem .85rem;
      border-radius: 999px;
      color: var(--navy);
      background: var(--white);
      font-size: .76rem;
      font-weight: 780;
    }

    .hero-primary svg {
      width: 1rem;
      height: 1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      padding-top: .05rem;
    }

    .section-label h3 {
      margin: 0;
      color: var(--navy);
      font-size: .86rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .section-label span {
      color: var(--muted);
      font-size: .66rem;
      font-weight: 650;
    }

    .placement-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .55rem;
    }

    .placement-card,
    .wide-card {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 6.4rem;
      align-content: space-between;
      gap: .4rem;
      padding: .75rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 8px 22px rgba(0, 0, 60, .055);
    }

    .placement-card {
      cursor: pointer;
    }

    .placement-card::before,
    .wide-card::before {
      width: 1.9rem;
      height: 3px;
      border-radius: 999px;
      background: var(--accent, var(--saffron));
      content: "";
    }

    .placement-card strong,
    .wide-card strong {
      color: var(--navy);
      font-size: .78rem;
      font-weight: 790;
      line-height: 1.2;
    }

    .placement-card span,
    .wide-card span {
      color: var(--muted);
      font-size: .68rem;
      font-weight: 560;
      line-height: 1.35;
    }

    .card-arrow {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      justify-self: end;
      border-radius: 50%;
      color: var(--navy);
      background: var(--soft-navy);
    }

    .card-arrow svg {
      width: .9rem;
      height: .9rem;
    }

    .wide-card {
      min-height: auto;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
    }

    .wide-card::before {
      grid-column: 1 / -1;
    }

    .wide-card-copy {
      display: grid;
      gap: .18rem;
    }

    .chip-row {
      display: flex;
      gap: .4rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .info-chip {
      display: inline-flex;
      min-width: max-content;
      min-height: 32px;
      align-items: center;
      padding: .3rem .58rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--navy);
      background: var(--white);
      font-size: .65rem;
      font-weight: 720;
    }

    .context-rail {
      position: absolute;
      z-index: 2;
      top: .05rem;
      right: .55rem;
      bottom: .45rem;
      display: flex;
      width: 3.45rem;
      flex-direction: column;
      align-items: stretch;
      gap: .2rem;
      padding: .2rem .14rem;
      overflow-x: hidden;
      overflow-y: auto;
      border: 1px solid rgba(0, 0, 128, .1);
      border-radius: 22px;
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 10px 30px rgba(0, 0, 70, .11);
      backdrop-filter: blur(18px) saturate(150%);
      scrollbar-width: none;
    }

    .context-action {
      display: grid;
      min-height: 44px;
      flex: 0 0 auto;
      place-items: center;
      align-content: center;
      gap: .1rem;
      padding: .12rem .04rem;
      border-radius: 16px;
      color: var(--navy);
      cursor: pointer;
      background: transparent;
      text-align: center;
    }

    .context-action:hover,
    .context-action:focus-visible,
    .context-action.active {
      background: var(--soft-navy);
    }

    .context-action span {
      max-width: 3rem;
      overflow: hidden;
      font-size: .56rem;
      font-weight: 740;
      line-height: 1.08;
      text-overflow: ellipsis;
    }

    html[data-rail-direction="capability"] .focus-shell.social-first-layer {
      background: #050516;
    }

    html[data-rail-direction="capability"] .focus-shell.social-first-layer .focus-head,
    html[data-rail-direction="capability"] .focus-shell.social-first-layer .sub-action-strip,
    html[data-rail-direction="capability"] .focus-shell.social-first-layer .context-rail {
      display: none !important;
    }

    html[data-rail-direction="capability"] .focus-shell.social-first-layer .content-scroll {
      padding: 0 !important;
      overflow: hidden;
      scrollbar-width: none;
    }

    html[data-rail-direction="capability"] .focus-shell.social-first-layer .world-panel {
      width: 100%;
      height: 100%;
      gap: 0;
    }

    .social-first-layer-view {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      color: var(--ink);
      background: #f5f6fb;
      scrollbar-width: none;
    }

    .social-first-layer-view::-webkit-scrollbar,
    .social-feed-modes::-webkit-scrollbar,
    .social-video-row::-webkit-scrollbar {
      display: none;
    }

    .social-feed-modes {
      position: sticky;
      z-index: 8;
      top: 0;
      display: flex;
      width: 100%;
      align-items: center;
      gap: .2rem;
      padding: .34rem .45rem;
      overflow-x: auto;
      color: var(--white);
      background: rgba(0, 0, 65, .94);
      box-shadow: 0 8px 22px rgba(0, 0, 45, .18);
      backdrop-filter: blur(18px) saturate(150%);
      scrollbar-width: none;
    }

    .social-feed-mode {
      position: relative;
      display: inline-flex;
      min-width: max-content;
      min-height: 44px;
      flex: 1 0 auto;
      align-items: center;
      justify-content: center;
      padding: .38rem .72rem;
      border-radius: 999px;
      color: rgba(255, 255, 255, .72);
      cursor: pointer;
      background: transparent;
      font-size: .66rem;
      font-weight: 740;
      white-space: nowrap;
    }

    .social-feed-mode.active {
      color: var(--white);
      background: rgba(255, 255, 255, .13);
    }

    .social-video-modes .social-feed-mode {
      min-width: 44px;
    }

    .social-feed-mode.active::after {
      position: absolute;
      right: .72rem;
      bottom: .2rem;
      left: .72rem;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--saffron) 0 45%, var(--white) 45% 59%, var(--green) 59%);
      content: "";
    }

    .social-source-badge,
    .social-format-badge,
    .social-carousel-count,
    .social-duration {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      justify-content: center;
      padding: .28rem .5rem;

    html[data-rail-direction] .bottom-outcome-rail {

    html[data-rail-direction] [data-mool-toggle] {

      overflow: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 26% 12%, rgba(255, 255, 255, .25), transparent 30%),
        linear-gradient(145deg, #2020C8, var(--navy) 76%);
      box-shadow:
        0 9px 20px rgba(0, 0, 128, .24),
        inset 0 1px 0 rgba(255, 255, 255, .26);
    }

    html[data-rail-direction] [data-mool-toggle]::after {
      position: absolute;
      right: 14%;
      bottom: 4px;
      left: 14%;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        var(--saffron) 0 45%,
        var(--white) 45% 59%,
        var(--green) 59% 100%
      );
      content: "";
    }

    html[data-rail-direction] [data-mool-toggle].active {
      color: var(--navy);
      background: linear-gradient(145deg, #FFE3C0, var(--saffron));
    }

    html[data-rail-direction] .dock-action {
      min-height: 52px;
      border: 1px solid transparent;
      border-radius: 15px;
      font-size: clamp(.68rem, 2.9vw, .74rem);
      font-weight: 790;
      transition:
        color 180ms ease,
        background-color 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease,
        transform 180ms ease;
    }

    .rail-step {
      display: none;
    }

    html[data-rail-direction="capability"] .bottom-outcome-rail {
      --rail-progress: 0%;
      isolation: isolate;
      border-color: rgba(0, 0, 128, .1);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .97), rgba(249, 249, 255, .92));
      box-shadow:
        0 18px 44px rgba(0, 0, 70, .18),
        0 2px 8px rgba(0, 0, 70, .08),
        inset 0 1px 0 rgba(255, 255, 255, 1);
      transition:
        box-shadow 220ms ease,
        transform 180ms ease;
    }

    html[data-rail-direction="capability"] .bottom-outcome-rail::before {
      position: absolute;
      z-index: 3;
      top: 3px;
      right: 4.9rem;
      left: 4.9rem;
      height: 3px;
      border-radius: 999px;
      background:
        linear-gradient(
          90deg,
          var(--saffron) 0,
          var(--saffron) var(--rail-progress),
          rgba(0, 0, 128, .1) var(--rail-progress),
          rgba(0, 0, 128, .1) 100%
        );
      content: "";
      transition: background 220ms ease;
    }

    html[data-rail-direction="capability"] .rail-step {
      position: absolute;
      z-index: 5;
      top: 50%;
      display: grid;
      width: 44px;
      height: 52px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 0;
      color: var(--navy);
      cursor: pointer;
      background: transparent;
      box-shadow: none;
      transform: translateY(-50%);
      transition:
        color 160ms ease,
        transform 160ms ease;
    }

    html[data-rail-direction="capability"] .rail-step::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: "";
      pointer-events: none;
    }

    html[data-rail-direction="capability"] [data-rail-previous]::before {
      background: linear-gradient(90deg, rgba(249, 249, 255, .98), rgba(249, 249, 255, .72) 54%, transparent);
    }

    html[data-rail-direction="capability"] [data-rail-next]::before {
      background: linear-gradient(270deg, rgba(249, 249, 255, .98), rgba(249, 249, 255, .72) 54%, transparent);
    }

    html[data-rail-direction="capability"] .rail-step svg {
      display: none;
    }

    html[data-rail-direction="capability"] .rail-step::after {
      width: 6px;
      height: 6px;
      border-top: 1.5px solid rgba(0, 0, 128, .55);
      border-right: 1.5px solid rgba(0, 0, 128, .55);
      content: "";
      opacity: .76;
      transform: rotate(45deg);
      transition:
        border-color 160ms ease,
        opacity 160ms ease,
        transform 160ms ease;
    }

    html[data-rail-direction="capability"] [data-rail-previous]::after {
      transform: rotate(-135deg);
    }

    html[data-rail-direction="capability"] .rail-step:hover::after,
    html[data-rail-direction="capability"] .rail-step:focus-visible::after {
      border-color: var(--navy);
      opacity: 1;
    }

    html[data-rail-direction="capability"] [data-rail-previous]:hover::after,
    html[data-rail-direction="capability"] [data-rail-previous]:focus-visible::after {
      transform: rotate(-135deg) scale(1.16);
    }

    html[data-rail-direction="capability"] [data-rail-next]:hover::after,
    html[data-rail-direction="capability"] [data-rail-next]:focus-visible::after {
      transform: rotate(45deg) scale(1.16);
    }

    html[data-rail-direction="capability"] [data-rail-previous]:active::after {
      transform: rotate(-135deg) scale(.82);
    }

    html[data-rail-direction="capability"] [data-rail-next]:active::after {
      transform: rotate(45deg) scale(.82);
    }

    html[data-rail-direction="capability"] [data-rail-previous] {
      left: 4rem;
    }

    html[data-rail-direction="capability"] [data-rail-previous] svg {
      transform: rotate(180deg);
    }

    html[data-rail-direction="capability"] [data-rail-next] {
      right: 4rem;

    html[data-rail-direction="capability"] .focused-actions .dock-action.active {

      color: var(--white);

        radial-gradient(circle at 25% 8%, rgba(255, 255, 255, .22), transparent 35%),

      box-shadow:

    }

    html[data-rail-direction="capability"] .focused-actions .dock-action.active::after,
    html[data-rail-direction="capability"] .mool-actions .dock-action.root-active::after {
      position: absolute;
      right: 15%;
      bottom: 4px;
      left: 15%;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--saffron) 0 45%, var(--white) 45% 59%, var(--green) 59% 100%);

    }

    html[data-rail-direction="capability"] .dock-edge:active,
    html[data-rail-direction="capability"] .dock-action:active {

    }

    html[data-rail-direction="capability"] .focused-actions .dock-action.active::before,
    html[data-rail-direction="capability"] .mool-actions .dock-action.root-active::before {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .34), transparent) -55% center / 34% 220% no-repeat;
      content: "";
      opacity: 0;
    }

    html[data-rail-direction="capability"] .bottom-outcome-rail.rail-acknowledged .dock-action.active,
    html[data-rail-direction="capability"] .bottom-outcome-rail.rail-acknowledged .dock-action.root-active {

    html[data-rail-direction="capability"] .bottom-outcome-rail.rail-acknowledged .dock-action.active::before,
    html[data-rail-direction="capability"] .bottom-outcome-rail.rail-acknowledged .dock-action.root-active::before {
      animation: rail-sheen 460ms ease-out;

    @keyframes rail-acknowledged {

      max-height: min(88dvh, 760px);
      flex-direction: column;
      overflow: hidden;
      border-radius: 24px 24px 0 0;
      background: var(--surface);
      box-shadow: 0 -18px 48px rgba(0, 0, 44, .22);
      animation: sheet-up 240ms var(--ease) both;
    }

    @keyframes sheet-up {
      from {
        transform: translateY(18%);
        opacity: .6;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .sheet-handle {
      width: 2.5rem;
      height: 4px;
      flex: 0 0 auto;
      margin: .55rem auto .18rem;
      border-radius: 999px;
      background: #D7D8E2;
    }

    .sheet-head {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: .55rem .9rem .65rem 1rem;
      border-bottom: 1px solid var(--line);
    }

    .sheet-heading {
      min-width: 0;
    }

    .sheet-heading h2 {
      margin: 0;
      color: var(--navy);
      font-size: 1.05rem;
      font-weight: 820;
      letter-spacing: -.02em;
      line-height: 1.15;
    }

    .sheet-heading p {
      margin: .15rem 0 0;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 580;
      line-height: 1.3;
    }

    .sheet-close {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      border-radius: 50%;
      color: var(--navy);
      cursor: pointer;
      background: var(--soft-navy);
    }

    .sheet-body {
      min-height: 0;
      padding: .9rem 1rem max(1rem, env(safe-area-inset-bottom));
      overflow-x: hidden;
      overflow-y: auto;
    }

    .sheet-stack {
      display: grid;
      gap: .75rem;
    }

    .sheet-copy {
      margin: 0;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 560;
      line-height: 1.5;
    }

    .sheet-copy strong {
      color: var(--ink);
    }

    .field-label {
      display: grid;
      gap: .35rem;
      color: var(--ink);
      font-size: .72rem;
      font-weight: 740;
    }

    .text-field {
      width: 100%;
      min-height: 48px;
      padding: .68rem .78rem;
      border: 1px solid rgba(0, 0, 128, .18);
      border-radius: 12px;
      outline: none;
      color: var(--ink);
      background: var(--white);
      font-size: .8rem;
      font-weight: 580;
    }

    .text-field:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(0, 0, 128, .09);
    }

    .sheet-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .55rem;
    }

    .sheet-actions.single {
      grid-template-columns: 1fr;
    }

    .primary-button,
    .secondary-button,
    .text-button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      padding: .6rem .75rem;
      border-radius: 12px;
      cursor: pointer;
      font-size: .76rem;
      font-weight: 780;
      line-height: 1.2;
      text-align: center;
    }

    .primary-button {
      color: var(--white);
      background: var(--navy);
      box-shadow: 0 8px 20px rgba(0, 0, 128, .16);
    }

    .secondary-button {
      border: 1px solid var(--line);
      color: var(--navy);
      background: var(--white);
    }

    .text-button {
      color: var(--navy);
      background: var(--soft-navy);
    }

    .result-list {
      display: grid;
      gap: .5rem;
    }

    .result-row {
      display: grid;
      min-height: 58px;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: .6rem;
      padding: .65rem .7rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--white);
    }

    .result-copy {
      display: grid;
      gap: .12rem;
    }

    .result-copy strong {
      color: var(--navy);
      font-size: .76rem;
      font-weight: 790;
      line-height: 1.2;
    }

    .result-copy span {
      color: var(--muted);
      font-size: .67rem;
      font-weight: 560;
      line-height: 1.3;
    }

    .result-go {
      display: grid;
      min-width: 44px;
      min-height: 44px;
      place-items: center;
      border-radius: 12px;
      color: var(--navy);
      background: var(--soft-navy);
      font-size: .68rem;
      font-weight: 780;
    }

    .status-card {
      display: grid;
      min-height: 10rem;
      place-items: center;
      align-content: center;
      gap: .55rem;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--soft);
      text-align: center;
    }

    .status-icon {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border-radius: 18px;
      color: var(--navy);
      background: var(--soft-navy);
      font-size: 1.25rem;
      font-weight: 830;
    }

    .status-icon svg {
      width: 1.35rem;
      height: 1.35rem;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .status-card h3 {
      margin: 0;
      color: var(--navy);
      font-size: .92rem;
      font-weight: 810;
      line-height: 1.2;
    }

    .status-card p {
      max-width: 17rem;
      margin: 0;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 560;
      line-height: 1.45;
    }

    .loading-ring {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(0, 0, 128, .12);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .camera-frame {
      position: relative;
      display: grid;
      min-height: 13rem;
      place-items: center;
      overflow: hidden;
      border-radius: 16px;
      color: var(--white);
      background: linear-gradient(145deg, #10102A, #00005C);
    }

    .camera-frame::before {
      position: relative;
      z-index: 1;
      width: 8.5rem;
      height: 8.5rem;
      border: 3px solid var(--saffron);
      border-radius: 18px;
      content: "";
      box-shadow: 0 0 0 999px rgba(0, 0, 20, .28);
    }

    .camera-frame span {
      position: absolute;
      z-index: 2;
      right: 1rem;
      bottom: .8rem;
      left: 1rem;
      font-size: .7rem;
      font-weight: 680;
      line-height: 1.3;
      text-align: center;
    }

    .camera-frame video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .choice-list {
      display: grid;
      gap: .5rem;
    }

    .choice-button {
      display: grid;
      min-height: 58px;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: .5rem;
      padding: .65rem .75rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      cursor: pointer;
      background: var(--white);
      text-align: left;
    }

    .choice-button strong {
      color: var(--navy);
      font-size: .78rem;
      font-weight: 790;
    }

    .choice-button span {
      color: var(--muted);
      font-size: .67rem;
      font-weight: 560;
      line-height: 1.3;
    }

    .choice-button::after {
      color: var(--navy);
      content: "›";
      font-size: 1.3rem;
      font-weight: 500;
    }

    .choice-button[aria-pressed="true"] {
      border-color: rgba(0, 0, 128, .44);
      background: rgba(238, 238, 250, .78);
      box-shadow: inset 3px 0 0 var(--green);
    }

    .choice-button[aria-pressed="true"]::after {
      content: "✓";
      font-size: .9rem;
      font-weight: 820;
    }

    .danger-button {
      color: var(--danger);
      background: rgba(179, 38, 30, .08);
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    :focus-visible {
      outline: 3px solid var(--saffron);
      outline-offset: 2px;
    }

    @media (max-width: 350px) {
      .app-header {
        padding-right: .55rem;
        padding-left: .55rem;
      }

      .wordmark {
        font-size: 1.14rem;
      }

      .area-entry {
        max-width: 12.4rem;
      }

      .focus-head,
      .sub-action-strip {
        padding-right: .7rem;
        padding-left: .7rem;
      }

      html[data-rail-direction="capability"] .sub-action-strip.main-action-strip {
        margin-right: .7rem;
        margin-left: .7rem;
        padding-right: .16rem;
        padding-left: .16rem;
      }

      .main-action-button {
        padding-right: .08rem;
        padding-left: .08rem;
        font-size: .56rem;
      }

      .content-scroll {
        padding-right: 4.25rem;
        padding-left: .7rem;
      }

      .context-rail {
        right: .35rem;
      }

      .placement-grid {
        gap: .45rem;
      }

      .bottom-outcome-rail {
        grid-template-columns: 54px minmax(0, 1fr) 54px;
        gap: .2rem;
        padding-right: .35rem;
        padding-left: .35rem;
      }

      html[data-rail-direction="focus"] .bottom-outcome-rail {
        grid-template-columns: 50px minmax(0, 1fr) 50px;
        gap: .15rem;
      }

      html[data-rail-direction="capability"] [data-rail-previous] {
        left: 3.45rem;
      }

      html[data-rail-direction="capability"] [data-rail-next] {
        right: 3.45rem;
      }

      .focused-actions,
      .mool-actions {
        gap: .2rem;
      }

      .dock-action {
        min-width: 44px;
        flex-basis: 44px;
        padding-right: .12rem;
        padding-left: .12rem;
      }
    }

    @media (min-width: 431px) {
      .universal-app {
        border-right: 1px solid rgba(0, 0, 128, .08);
        border-left: 1px solid rgba(0, 0, 128, .08);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

        youtubePlaybackOutcome = "ready";
        renderWorld();
        acknowledgeRail();
      }

      function selectSocialVideoMode(modeId) {
        if (!Object.hasOwn(socialVideoModes, modeId)) return;
        currentSocialVideoMode = modeId;
        currentSocialVideoId = "";
        currentSocialVideoView = "home";
        visibleSocialVideoCount = 3;
        socialPlaying = false;
        youtubePlaybackOutcome = "ready";
        renderWorld();
        acknowledgeRail();
      }

      function prepareSocialChoice(choiceId) {
        if (currentWorld !== "social") return;
        if (choiceId === "shorts") {
          currentSocialReelIndex = 0;
          socialReelChromeVisible = true;
          socialReelTransition = "up";
          socialPlaying = availableSocialReels()[0]?.source === "moolsocial";
        }
        if (choiceId === "videos") {
          currentSocialVideoView = "home";
          socialPlaying = false;
        }
        if (choiceId === "feed") currentSocialFeedPanel = "home";
        if (choiceId === "create") {
          currentSocialCreateView = "home";
          socialCreatePublishedKind = "";
          socialCreateAudienceOpen = false;
        }
      }

      function renderWorld() {
        const world = worldChoices[currentWorld];
        const choiceId = currentChoice[currentWorld];
        const choice = world.choices.find((item) => item.id === choiceId) || world.choices[0];
        if (currentWorld === "social" && renderedSocialChoice !== choiceId) {
          socialPlaying = false;
          youtubePlaybackOutcome = "ready";
          renderedSocialChoice = choiceId;
        }
        const content = contentChoices[choice.id];
        worldTitle.textContent = world.label;
        focusTitle.textContent = railDirection === "capability" ? world.tagline : content.title;
        commandCopy.textContent = world.prompt;

        const showSocialFirstLayer = railDirection === "capability" && currentWorld === "social";
        const showImmersiveShorts = showSocialFirstLayer && choice.id === "shorts";
        app.classList.toggle("social-shorts-immersive", showImmersiveShorts);
        focusShell.classList.toggle("social-first-layer", showSocialFirstLayer);
        subStrip.classList.remove("main-action-strip");
        subStrip.hidden = railDirection === "capability";
        if (!showSocialFirstLayer) {
          subStrip.setAttribute("aria-label", `${world.label} choices`);
          subStrip.innerHTML = world.choices.map((item) => `
            <button class="sub-action-chip ${item.id === choice.id ? "active" : ""}" type="button" data-sub-choice="${item.id}" aria-pressed="${item.id === choice.id}">
              ${item.label}
            </button>
          `).join("");
        }

        if (showSocialFirstLayer) {
          worldPanel.innerHTML = socialFirstLayerMarkup(choice.id);
          contextRail.hidden = true;
          contextRail.innerHTML = "";
        } else {
          const primaryHref = content.primary[1];
          let primaryAttributes = `href="${primaryHref}"`;
          if (primaryHref === "#open-scan-pay") primaryAttributes = 'href="#scan-pay" data-open-payment-scan';
          if (primaryHref.startsWith("#social-")) {
            primaryAttributes = `href="${primaryHref}" data-social-action="${primaryHref.slice("#social-".length)}"`;
          }
          worldPanel.innerHTML = `
            <article class="hero-card" style="--hero-background:${content.accent}">
              <p class="eyebrow">${content.eyebrow}</p>
              <h2>${content.title}</h2>
              <p>${content.copy}</p>
              <a class="hero-primary" ${primaryAttributes}>
                ${content.primary[0]}
                ${iconMarkup("arrow")}
              </a>
            </article>
            <div class="section-label">
              <h3>${content.label}</h3>
              <span>${content.note}</span>
            </div>
            <div class="placement-grid">
              ${content.cards.map(placementMarkup).join("")}
            </div>
            <div class="chip-row" aria-label="${choice.label} highlights">
              ${content.chips.map((chip) => `<span class="info-chip">${chip}</span>`).join("")}
            </div>
          `;

          contextRail.hidden = false;
          contextRail.setAttribute("aria-label", `${choice.label} actions`);
          contextRail.innerHTML = (railChoices[choice.id] || []).map((action, index) => {
            const [label, icon, outcome] = action;
            if (outcome.startsWith("./")) {
              return `
                <a class="context-action" href="${outcome}" aria-label="${label}" data-rail-index="${index}">
                  ${iconMarkup(icon)}
                  <span>${label}</span>
                </a>
              `;
            }
            return `
              <button class="context-action" type="button" data-rail-outcome="${outcome}" data-rail-label="${label}" data-rail-index="${index}" aria-label="${label}">
                ${iconMarkup(icon)}
                <span>${label}</span>
              </button>
            `;
          }).join("");
        }

        focusedActions.setAttribute("aria-label", `${world.label} choices`);
        focusedActions.innerHTML = world.choices.map((item) => `
          <button class="dock-action ${item.id === choice.id ? "active" : ""}" type="button" data-dock-choice="${item.id}" aria-pressed="${item.id === choice.id}">
            ${item.label}
          </button>
        `).join("");

        moolActions.innerHTML = rootChoices.map((item) => `
          <button class="dock-action ${item.id === currentWorld ? "root-active" : ""}" type="button" data-root-choice="${item.id}" aria-pressed="${item.id === currentWorld}">
            ${item.label}
          </button>
        `).join("");

        syncRailDirection();

        contentScroll.scrollTop = 0;
        if (showSocialFirstLayer && choice.id === "shorts") scheduleSocialReelChrome();
        else window.clearTimeout(socialReelChromeTimer);
      }

      function worldOffset(offset) {
        const index = rootChoices.findIndex((item) => item.id === currentWorld);
        return rootChoices[(index + offset + rootChoices.length) % rootChoices.length];
      }

      function choiceOffset(offset) {
        const choices = worldChoices[currentWorld].choices;
        const activeId = currentChoice[currentWorld];
        const index = choices.findIndex((item) => item.id === activeId);
        return choices[(index + offset + choices.length) % choices.length];
      }

      function renderCarouselRail() {
        const previous = worldOffset(-1);
        const active = worldOffset(0);
        const next = worldOffset(1);
        focusedActions.setAttribute("aria-label", "Choose a MoolSocial action");
        focusedActions.innerHTML = `
          <button class="dock-action carousel-action carousel-side" type="button" data-carousel-world="${previous.id}" aria-label="Previous action, ${previous.label}">‹ ${previous.label}</button>
          <button class="dock-action carousel-action carousel-current" type="button" data-carousel-world="${active.id}" aria-pressed="true">${active.label}</button>
          <button class="dock-action carousel-action carousel-side" type="button" data-carousel-world="${next.id}" aria-label="Next action, ${next.label}">${next.label} ›</button>
        `;
      }

      function syncRailDirection() {
        if (!railDirection || !bottomRail) return;
        const capabilityRail = railDirection === "capability";
        railPrevious.hidden = !capabilityRail;
        railNext.hidden = !capabilityRail;
        bottomRail.classList.toggle("mool-open", moolOpen);
        bottomRail.dataset.railMode = moolOpen ? "main" : "choices";
        const rootIndex = rootChoices.findIndex((item) => item.id === currentWorld);
        bottomRail.style.setProperty("--rail-progress", `${Math.max(0, rootIndex) / (rootChoices.length - 1) * 100}%`);
        if (moolOpen) {
          focusedActions.hidden = true;
          moolActions.hidden = false;
          moolToggle.classList.add("active");
          moolToggle.setAttribute("aria-expanded", "true");
          moolToggle.setAttribute("aria-label", `Show ${worldChoices[currentWorld].label} choices`);
          bottomRail.setAttribute("aria-label", "MoolSocial actions");
          syncRailControls();
          centerActiveRailAction();
          return;
        }
        moolActions.hidden = true;
        focusedActions.hidden = false;
        moolToggle.classList.remove("active");
        moolToggle.setAttribute("aria-expanded", "false");
        moolToggle.setAttribute("aria-label", "Show all MoolSocial actions");
        bottomRail.setAttribute("aria-label", `${worldChoices[currentWorld].label} choices`);
        if (railDirection === "carousel") renderCarouselRail();
        syncRailControls();
        centerActiveRailAction();
      }

      function syncRailControls() {
        if (railDirection !== "capability") return;
        const previous = moolOpen ? worldOffset(-1) : choiceOffset(-1);
        const next = moolOpen ? worldOffset(1) : choiceOffset(1);
        const noun = moolOpen ? "action" : `${worldChoices[currentWorld].label} choice`;
        railPrevious.setAttribute("aria-label", `Previous ${noun}, ${previous.label}`);
        railPrevious.title = previous.label;
        railNext.setAttribute("aria-label", `Next ${noun}, ${next.label}`);
        railNext.title = next.label;
      }

      function centerActiveRailAction() {
        if (railDirection !== "capability") return;
        requestAnimationFrame(() => {
          const container = moolOpen ? moolActions : focusedActions;
          container.querySelector(moolOpen ? ".root-active" : ".active")?.scrollIntoView({
            inline: "center",
            block: "nearest",
            behavior: "smooth"
          });
        });
      }

      function acknowledgeRail() {
        if (railDirection !== "capability") return;
        bottomRail.classList.remove("rail-acknowledged");
        void bottomRail.offsetWidth;
        bottomRail.classList.add("rail-acknowledged");
        if (navigator.userActivation?.isActive && typeof navigator.vibrate === "function") {
          navigator.vibrate(8);
        }
        window.setTimeout(() => bottomRail.classList.remove("rail-acknowledged"), 300);
      }

      function selectAdjacentWorld(offset) {
        const nextWorld = worldOffset(offset);
        if (!nextWorld) return;
        selectWorld(nextWorld.id, { defaultChoice: true });
      }

      function selectAdjacentChoice(offset) {
        const nextChoice = choiceOffset(offset);
        if (!nextChoice) return;
        selectChoice(nextChoice.id);
      }

      function moveRail(offset) {
        if (railDirection === "capability") {
          if (moolOpen) {
            closeMool();
            selectAdjacentWorld(offset);
          } else {
            selectAdjacentChoice(offset);
          }
          acknowledgeRail();
          return;
        }
        if (moolOpen || railDirection === "carousel") selectAdjacentWorld(offset);
        else selectAdjacentChoice(offset);
      }

      function selectWorld(worldId, options = {}) {
        if (!worldChoices[worldId]) return;
        currentWorld = worldId;
        if (options.defaultChoice) currentChoice[worldId] = worldChoices[worldId].defaultChoice;
        renderWorld();
        if (options.remember !== false) {
          history.pushState({ focus: { world: currentWorld, choice: currentChoice[currentWorld] }, railOpen: moolOpen }, "", location.href);
        }
      }

      function selectChoice(choiceId, options = {}) {
        const world = worldChoices[currentWorld];
        if (!world.choices.some((item) => item.id === choiceId)) return;
        currentChoice[currentWorld] = choiceId;
        renderWorld();
        if (options.remember !== false) {
          history.pushState({ focus: { world: currentWorld, choice: choiceId }, railOpen: moolOpen }, "", location.href);
        }
      }

      function openMool(options = {}) {
        if (moolOpen) return;
        moolOpen = true;
        focusedActions.hidden = true;
        moolActions.hidden = false;
        moolToggle.classList.add("active");
        moolToggle.setAttribute("aria-expanded", "true");
        bottomRail?.classList.add("mool-open");
        syncRailDirection();
        acknowledgeRail();
        if (options.remember !== false) {
          history.pushState({ focus: { world: currentWorld, choice: currentChoice[currentWorld] }, panel: "mool", railOpen: true }, "", location.href);
        }
        requestAnimationFrame(() => {
          moolActions.querySelector(".root-active")?.scrollIntoView({ inline: "center", block: "nearest" });
        });
      }

      function closeMool(options = {}) {
        if (!moolOpen) return;
        moolOpen = false;
        focusedActions.hidden = false;
        moolActions.hidden = true;
        moolToggle.classList.remove("active");
        moolToggle.setAttribute("aria-expanded", "false");
        bottomRail?.classList.remove("mool-open");
        syncRailDirection();
        if (options.back && history.state?.panel === "mool") history.back();
      }

      function openSheet(title, subtitle, body, name, options = {}) {
        previousFocus = document.activeElement;
        openPanel = name;
        sheetTitle.textContent = title;
        sheetSubtitle.textContent = subtitle || "";
        sheetSubtitle.hidden = !subtitle;
        sheetBody.innerHTML = body;
        sheetLayer.hidden = false;
        document.body.style.overflow = "hidden";
        if (options.remember !== false) {
          history.pushState({ focus: { world: currentWorld, choice: currentChoice[currentWorld] }, panel: name, railOpen: moolOpen }, "", location.href);
        }
        requestAnimationFrame(() => {
          const preferred = sheetBody.querySelector("[autofocus]");
          (preferred || document.querySelector("[data-sheet-close]"))?.focus();
        });
      }

      function hideSheet(options = {}) {
        if (sheetLayer.hidden) return;
        stopActiveCamera();
        stopActiveSpeech();
        sheetLayer.hidden = true;
        sheetBody.innerHTML = "";
        openPanel = "";
        document.body.style.overflow = "";
        if (options.restore !== false && previousFocus instanceof HTMLElement) previousFocus.focus();
        if (options.back && history.state?.panel && history.state.panel !== "mool") history.back();
      }

      function loadingCard(copy) {
        return `
          <div class="status-card" aria-live="polite">
            <span class="loading-ring" aria-hidden="true"></span>
            <h3>${copy}</h3>
            <p>This usually takes only a moment.</p>
          </div>
        `;
      }

      function outcomeCard(symbol, title, copy, actions) {
        return `
          <div class="sheet-stack">
            <div class="status-card">
              <span class="status-icon" aria-hidden="true">${symbol}</span>
              <h3>${title}</h3>
              <p>${copy}</p>
            </div>
            <div class="sheet-actions ${actions.length === 1 ? "single" : ""}">
              ${actions.join("")}
            </div>
          </div>
        `;
      }

      function openSearch(view = "ready", value = "") {
        const searchForm = `
          <form class="sheet-stack" data-search-form>
            <label class="field-label">
              What do you need?
              <input class="text-field" name="query" type="search" value="${safeText(value)}" placeholder="People, products, food, rides or work" autocomplete="off" autofocus>
            </label>
            <div class="sheet-actions">
              <button class="secondary-button" type="button" data-close-panel>Cancel</button>
              <button class="primary-button" type="submit">Search</button>
            </div>
            <div class="chip-row" aria-label="Popular searches">
              <button class="text-button" type="button" data-search-suggestion="grocery near me">Grocery</button>
              <button class="text-button" type="button" data-search-suggestion="bike ride">Bike ride</button>
              <button class="text-button" type="button" data-search-suggestion="work today">Work today</button>
            </div>
          </form>
        `;
        let body = searchForm;
        if (view === "loading") body = loadingCard("Finding the best matches");
        if (view === "empty") {
          body = outcomeCard("⌕", "No matches yet", `Try a broader word or check the spelling for “${safeText(value)}”.`, [
            '<button class="secondary-button" type="button" data-search-again>Change search</button>',
            '<button class="primary-button" type="button" data-close-panel>Done</button>'
          ]);
        }
        if (view === "unavailable") {
          body = outcomeCard("⌕", "Search is taking a break", "Your focused choices are still available while search reconnects.", [
            '<button class="secondary-button" type="button" data-close-panel>Keep browsing</button>',
            '<button class="primary-button" type="button" data-search-retry>Try again</button>'
          ]);
        }
        if (view === "failure") {
          body = outcomeCard("!", "We couldn’t complete that search", "Your request is safe. Check your connection and try once more.", [
            '<button class="secondary-button" type="button" data-search-again>Change search</button>',
            '<button class="primary-button" type="button" data-search-retry>Try again</button>'
          ]);
        }
        openSheet("Search MoolSocial", "Find an outcome across your MoolSocial world.", body, "search", { remember: view === "ready" });
      }

      function showSearchResults(query) {
        const lower = query.toLowerCase();
        if (!query.trim() || /nothing|unknown|zzzz/.test(lower)) {
          sheetBody.innerHTML = outcomeCard("⌕", "No matches yet", `Try a broader word or check the spelling for “${safeText(query || "your search")}”.`, [
            '<button class="secondary-button" type="button" data-search-again>Change search</button>',
            '<button class="primary-button" type="button" data-close-panel>Done</button>'
          ]);
          return;
        }

        const resultPool = [
          ["Shorts for you", "Fresh local moments and creators", paths.shorts, /short|video|social|creator/],
          ["Grocery nearby", "Fresh and household essentials", paths.buy + "?view=grocery", /grocery|buy|shop|milk|food/],
          ["Order food", "Restaurants serving your area", paths.eat, /eat|food|restaurant|meal/],
          ["Book a bike", "See nearby rides and fare", paths.ride + "?type=bike", /ride|bike|auto|cab|travel/],
          ["Find a doctor", "Browse care by speciality and time", paths.doctor, /doctor|health|care|medicine/],
          ["Recharge mobile", "Choose a number and plan", paths.recharge, /pay|recharge|mobile|bill/],
          ["Work today", "Nearby opportunities with details", paths.earn, /work|job|earn|delivery/],
          ["People and chats", "Continue a conversation", paths.chatPeople, /chat|people|friend|message/]
        ];
        let matches = resultPool.filter((item) => item[3].test(lower));
        if (!matches.length) matches = resultPool.slice(0, 4);
        sheetBody.innerHTML = `
          <div class="sheet-stack">
            <p class="sheet-copy">Best matches for <strong>“${safeText(query)}”</strong></p>
            <div class="result-list">
              ${matches.map((item) => `
                <a class="result-row" href="${item[2]}">
                  <span class="result-copy"><strong>${item[0]}</strong><span>${item[1]}</span></span>
                  <span class="result-go">Open</span>
                </a>
              `).join("")}
            </div>
            <button class="secondary-button" type="button" data-search-again>Change search</button>
          </div>
        `;
      }

      function openScan(view = "ready") {
        if (view !== "camera") stopActiveCamera();
        let body = `
          <div class="sheet-stack">
            <p class="sheet-copy">Use your camera to read a MoolSocial, UPI or store code. You will always check the recipient before continuing.</p>
            <div class="sheet-actions">
              <button class="secondary-button" type="button" data-scan-manual>Enter code</button>
              <button class="primary-button" type="button" data-scan-camera>Use camera</button>
            </div>
            <input class="visually-hidden" type="file" accept="image/*" data-scan-file tabindex="-1">
            <button class="secondary-button" type="button" data-scan-image>Choose image</button>
            <button class="text-button" type="button" data-close-panel>Cancel</button>
          </div>
        `;
        if (view === "loading") body = loadingCard("Starting the camera");
        if (view === "camera") {
          body = `
            <div class="sheet-stack">
              <div class="camera-frame">
                <video data-camera-video autoplay playsinline muted aria-label="Camera view"></video>
                <span>Hold the code inside the frame</span>
              </div>
              <div class="sheet-actions">
                <button class="secondary-button" type="button" data-scan-manual>Enter code</button>
                <button class="primary-button" type="button" data-scan-read>Read code</button>
              </div>
            </div>
          `;
        }
        if (view === "denied") {
          body = outcomeCard("⌁", "Camera access is off", "Allow camera access in your browser, or enter the code details instead.", [
            '<button class="secondary-button" type="button" data-scan-manual>Enter code</button>',
            '<button class="primary-button" type="button" data-scan-camera>Try camera again</button>'
          ]);
        }
        if (view === "unavailable") {
          body = outcomeCard("⌁", "Camera isn’t available", "You can still enter a UPI ID or code without using the camera.", [
            '<button class="secondary-button" type="button" data-close-panel>Cancel</button>',
            '<button class="primary-button" type="button" data-scan-manual>Enter code</button>'
          ]);
        }
        if (view === "failure") {
          body = outcomeCard("!", "The code could not be read", "Hold the code steady in good light, or enter the details yourself.", [
            '<button class="secondary-button" type="button" data-scan-manual>Enter code</button>',
            '<button class="primary-button" type="button" data-scan-camera>Try again</button>'
          ]);
        }
        openSheet("Scan a code", "Check every payment detail before you continue.", body, "scan", { remember: view === "ready" });
      }

      function openManualCode(value = "") {
        sheetBody.innerHTML = `
          <form class="sheet-stack" data-code-form>
            <label class="field-label">
              UPI ID or code
              <input class="text-field" name="code" value="${safeText(value)}" placeholder="name@bank" autocomplete="off" autofocus>
            </label>
            <p class="sheet-copy">We will check the recipient before showing payment choices.</p>
            <div class="sheet-actions">
              <button class="secondary-button" type="button" data-scan-ready>Back</button>
              <button class="primary-button" type="submit">Check recipient</button>
            </div>
          </form>
        `;
      }

      function showCodeResult(value) {
        const cleanValue = String(value || "").trim();
        if (!cleanValue) {
          openScan("failure");
          return;
        }
        sheetBody.innerHTML = `
          <div class="sheet-stack">
            <div class="wide-card" style="--accent:var(--green)">
              <div class="wide-card-copy">
                <strong>UPI details ready</strong>
                <span>${safeText(cleanValue)}</span>
              </div>
              <span class="status-icon" aria-hidden="true">${iconMarkup("check")}</span>
            </div>
            <p class="sheet-copy">Check the UPI ID. Recipient verification and the amount come next.</p>
            <div class="sheet-actions">
              <button class="secondary-button" type="button" data-scan-manual>Change details</button>
              <a class="primary-button" href="${paths.scanPay}?payee=${encodeURIComponent(cleanValue)}">Verify recipient</a>
            </div>
          </div>
        `;
      }

      async function requestMedia(kind) {
        const isVideo = kind === "scan";
        if (!navigator.mediaDevices?.getUserMedia) {
          isVideo ? openScan("unavailable") : openVoice("unavailable");
          return;
        }
        isVideo ? openScan("loading") : openVoice("loading");
        try {
          const stream = await navigator.mediaDevices.getUserMedia(isVideo ? { video: { facingMode: "environment" } } : { audio: true });
          if (isVideo) {
            activeMediaStream = stream;
            openScan("camera");
            const video = document.querySelector("[data-camera-video]");
            if (video) {
              video.srcObject = stream;
              await video.play().catch(() => {});
            }
          } else {
            stream.getTracks().forEach((track) => track.stop());
            openVoice("listening");
            beginSpeechRecognition();
          }
        } catch (error) {
          const denied = error?.name === "NotAllowedError" || error?.name === "SecurityError";
          isVideo ? openScan(denied ? "denied" : "failure") : openVoice(denied ? "denied" : "failure");
        }
      }

      function stopActiveCamera() {
        activeMediaStream?.getTracks().forEach((track) => track.stop());
        activeMediaStream = null;
      }

      async function readLiveCode() {
        const video = document.querySelector("[data-camera-video]");
        if (!activeMediaStream || !video || !("BarcodeDetector" in window)) {
          stopActiveCamera();
          sheetBody.innerHTML = outcomeCard("⌁", "Live code reading isn’t available", "Choose an image or enter the UPI ID or code yourself.", [
            '<button class="secondary-button" type="button" data-scan-image>Choose image</button>',
            '<button class="primary-button" type="button" data-scan-manual>Enter code</button>'
          ]);
          return;
        }
        const readButton = document.querySelector("[data-scan-read]");
        if (readButton) {
          readButton.disabled = true;
          readButton.textContent = "Reading…";
        }
        try {
          const detector = new BarcodeDetector();
          const results = await detector.detect(video);
          const value = results[0]?.rawValue?.trim();
          stopActiveCamera();
          if (value) {
            showCodeResult(value);
          } else {
            openScan("failure");
          }
        } catch (_) {
          stopActiveCamera();
          openScan("failure");
        }
      }

      function beginSpeechRecognition() {
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Recognition) return;
        try {
          activeRecognition?.stop();
          const recognition = new Recognition();
          activeRecognition = recognition;
          recognition.lang = document.documentElement.lang || "en-IN";
          recognition.interimResults = true;
          recognition.maxAlternatives = 1;
          recognition.onresult = (event) => {
            const words = [...event.results].map((result) => result[0]?.transcript || "").join(" ").trim();
            const field = document.querySelector("[data-voice-text]");
            if (field && words) field.value = words;
          };
          recognition.onend = () => {
            if (activeRecognition === recognition) activeRecognition = null;
          };
          recognition.onerror = () => {
            if (activeRecognition === recognition) activeRecognition = null;
          };
          recognition.start();
        } catch (_) {
          activeRecognition = null;
        }
      }

        try {

      async function readCodeFromImage(file) {
        if (!file) return;
        if (!("BarcodeDetector" in window) || !window.createImageBitmap) {
          sheetBody.innerHTML = outcomeCard("⌁", "Image scanning isn’t available", "Use your camera or enter the UPI ID or code yourself.", [
            '<button class="secondary-button" type="button" data-scan-manual>Enter code</button>',
            '<button class="primary-button" type="button" data-scan-camera>Use camera</button>'
          ]);
          return;
        }
        sheetBody.innerHTML = loadingCard("Reading the image");
        try {
          const bitmap = await createImageBitmap(file);
          const detector = new BarcodeDetector();
          const results = await detector.detect(bitmap);
          bitmap.close?.();
          const value = results[0]?.rawValue?.trim();
          if (value) {
            showCodeResult(value);
          } else {
            openScan("failure");
          }
        } catch (_) {
          openScan("failure");
        }
      }

      function toggleRail(button) {
        const label = button.dataset.railLabel || "Item";
        const active = !button.classList.contains("active");
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
        const copy = button.querySelector("span");
        if (copy) {
          if (label === "Like") copy.textContent = active ? "Liked" : "Like";
          if (label === "Save") copy.textContent = active ? "Saved" : "Save";
          if (label === "Repost") copy.textContent = active ? "Reposted" : "Repost";
        }
        const messages = {
          Like: active ? "Added to your liked items." : "Removed from your liked items.",
          Save: active ? "Saved to your MoolSocial list." : "Removed from your saved list.",
          Repost: active ? "Shared with your followers." : "Removed from your followers’ feeds."
        };
        showToast(messages[label] || `${label} updated.`);
      }

            last.focus();

            event.preventDefault();

          }
        }
        if (
          railDirection === "capability" &&
          sheetLayer.hidden &&
          bottomRail.contains(document.activeElement) &&
          (event.key === "ArrowLeft" || event.key === "ArrowRight")
        ) {
          event.preventDefault();
          moveRail(event.key === "ArrowRight" ? 1 : -1);
        }
        if (
          railDirection === "capability" &&
          sheetLayer.hidden &&
          currentWorld === "social" &&
          currentChoice.social === "shorts" &&
          (event.key === "ArrowUp" || event.key === "ArrowDown") &&
          !bottomRail.contains(document.activeElement)
        ) {
          event.preventDefault();
          advanceSocialReel(event.key === "ArrowDown" ? 1 : -1);
        }
      });

      window.addEventListener("popstate", restoreFromHistory);

      if (railDirection && bottomRail) {
        let swipeStart = null;
        let suppressRailClick = false;
        bottomRail.addEventListener("pointerdown", (event) => {
          if (!event.target.closest("[data-focused-actions], [data-mool-actions]")) return;
          swipeStart = { x: event.clientX, y: event.clientY, pointerId: event.pointerId };
        });
        bottomRail.addEventListener("pointerup", (event) => {
          if (!swipeStart || swipeStart.pointerId !== event.pointerId) return;
          const dx = event.clientX - swipeStart.x;
          const dy = event.clientY - swipeStart.y;
          swipeStart = null;
          if (Math.abs(dx) < 38 || Math.abs(dx) <= Math.abs(dy) * 1.2) return;
          suppressRailClick = true;
          moveRail(dx < 0 ? 1 : -1);
          window.setTimeout(() => { suppressRailClick = false; }, 0);
        });
        bottomRail.addEventListener("pointercancel", () => { swipeStart = null; });
        bottomRail.addEventListener("click", (event) => {
          if (!suppressRailClick) return;
          event.preventDefault();
          event.stopPropagation();
        }, true);
      }

      const machine = {
        get focus() {
          return {
            world: currentWorld,
            choice: currentChoice[currentWorld],
            socialMode: currentSocialMode,
            socialVideoMode: currentSocialVideoMode,
            socialVideoView: currentSocialVideoView,
            socialReelIndex: currentSocialReelIndex,
            socialReelChromeVisible,
            panel: openPanel,
            moolOpen
          };
        },
        get socialSources() {
          return Object.values(socialSources).map((source) => ({ id: source.id, enabled: source.enabled, watchInside: source.watchInside, formats: [...source.formats] }));
        },
        worlds: rootChoices.map((item) => item.id),
        choices: Object.fromEntries(Object.entries(worldChoices).map(([key, value]) => [key, value.choices.map((item) => item.id)])),
        focusWorld(world, choice) {
          selectWorld(world, { defaultChoice: !choice, remember: false });
          if (choice) {
            prepareSocialChoice(choice);
            selectChoice(choice, { remember: false });
          }
        },
        focusSocialMode(mode) {
          selectSocialMode(mode);
        },
        focusSocialVideoMode(mode) {
          selectSocialVideoMode(mode);
        },
        stepSocialReel(step = 1) {
          advanceSocialReel(Number(step) < 0 ? -1 : 1);
        },
        showSocialVideo(videoId) {
          const item = socialVideos.find((video) => video.id === videoId);
          if (!item) return;
          currentWorld = "social";
          currentChoice.social = "videos";
          currentSocialVideoId = item.id;
          currentSocialVideoView = "watch";
          socialPlaying = false;
          renderWorld();
        },
        showSocialVideoHome() {
          currentSocialVideoView = "home";
          socialPlaying = false;
          renderWorld();
        },
        showYoutubeOutcome(outcome = "ready") {
          if (!["ready", "unavailable", "restricted", "failed"].includes(outcome)) return;
          youtubePlaybackOutcome = outcome;
          socialPlaying = false;
          renderWorld();
        },
        showSocialCreate(view = "home") {
          if (!["home", "post", "reel", "carousel", "drafts"].includes(view)) return;
          currentWorld = "social";
          currentChoice.social = "create";
          currentSocialCreateView = view;
          socialCreatePublishedKind = "";
          renderWorld();
        },
        showSocialFeed(panel = "home") {
          currentWorld = "social";
          currentChoice.social = "feed";
          currentSocialFeedPanel = panel === "comments" ? "comments" : "home";
          renderWorld();
        },
        showMool() {
          openMool({ remember: false });
        },
        closeMoolMenu() {
          closeMool();
        },
        show(name, view = "ready") {
          if (name === "search") openSearch(view);
          if (name === "scan") openScan(view);
          if (name === "voice") openVoice(view);
          if (name === "notifications") openNotifications(view);
          if (name === "profile") openProfile();
          if (name === "area") openArea(view);
        },
        hide() {
          hideSheet();
        }
      };

      Object.defineProperty(window, "__MOOLSOCIAL_UNIVERSAL__", {
        value: Object.freeze(machine),
        configurable: false,
        writable: false
      });

      renderWorld();
      if (railDirection === "capability" || railDirection === "focus") {
        openMool({ remember: false });
      }
      history.replaceState({ focus: { world: currentWorld, choice: currentChoice[currentWorld] }, railOpen: moolOpen }, "", location.href);
    })();
  </script>
</body>
</html>
